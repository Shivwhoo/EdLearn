services:
  postgres:
    image: postgres:15-alpine
    container_name: edlearn-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edlearn
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: edlearn-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: edlearn
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: edlearn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: edlearn-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/edlearn?schema=public
    depends_on:
      - postgres
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into .next/routes-manifest.json at `next build` time (see
        # frontend/Dockerfile) — this is what actually controls the "/api/*"
        # rewrite destination in the production standalone server, not a
        # runtime env var alone.
        BACKEND_URL: http://backend:5000
    container_name: edlearn-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Server-side only (next.config.ts rewrites "/api/*" here). Inside the
      # frontend container, "localhost" means the frontend container itself,
      # not the backend — must use the Docker network service name. Kept
      # alongside the build arg above for any runtime code paths that read
      # process.env.BACKEND_URL directly.
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

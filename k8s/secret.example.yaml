# M2: Template for the "edlearn-secrets" Kubernetes Secret.
#
# DO NOT `kubectl apply -f` this file as-is and DO NOT fill in real values
# here and commit it. This documents the required keys only.
#
# Recommended ways to actually create the Secret in a real cluster:
#
#   1. Imperatively, from a local (gitignored) env file:
#        kubectl create secret generic edlearn-secrets \
#          --namespace edlearn \
#          --from-env-file=./backend/.env
#
#   2. Via your CI/CD pipeline injecting values from GitHub Actions secrets /
#      your cloud provider's secret manager at deploy time.
#
#   3. Via a GitOps-friendly secrets tool (Sealed Secrets, External Secrets
#      Operator, SOPS, etc.) so encrypted values CAN safely live in git.
#
# All values below are placeholders — replace before use, and never via this
# file directly.
apiVersion: v1
kind: Secret
metadata:
  name: edlearn-secrets
  namespace: edlearn
type: Opaque
stringData:
  # --- Databases ---
  DATABASE_URL: "REPLACE_ME"
  MONGODB_URI: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"

  # --- Auth ---
  JWT_SECRET: "REPLACE_ME"
  SSO_SHARED_SECRET: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"

  # --- AI providers ---
  GROQ_API_KEY: "REPLACE_ME"
  GEMINI_API_KEY: "REPLACE_ME"

  # --- Media storage (S3/R2) — only required when STORAGE_PROVIDER=s3 ---
  S3_ACCESS_KEY_ID: "REPLACE_ME"
  S3_SECRET_ACCESS_KEY: "REPLACE_ME"

  # --- Observability ---
  # Treated as a secret here since it's an out-of-band credential to your
  # Sentry project, even though it isn't as sensitive as the values above.
  SENTRY_DSN: "REPLACE_ME"
